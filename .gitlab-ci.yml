stages:
  - validate
  - build
  - publish

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
  CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_*"
  CIBW_ENVIRONMENT: "FPGA_VERIFICATION_BINARY=1"

validate-release:
  stage: validate
  image: python:3.12-bookworm
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - >-
      python -c "import os, tomllib;
      version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
      actual = os.environ['CI_COMMIT_TAG']; expected = f'v{version}';
      assert actual == expected, f'tag {actual!r} does not match version {version!r}'"

build-linux-wheels:
  stage: build
  image: python:3.12-bookworm
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    CIBW_ARCHS: "x86_64"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends docker.io
    - python -m pip install -U cibuildwheel
  script:
    - python -m cibuildwheel --output-dir wheelhouse
  artifacts:
    paths:
      - wheelhouse/*.whl
    expire_in: 1 week

build-windows-wheels:
  stage: build
  tags:
    - saas-windows-medium-amd64
  variables:
    CIBW_ARCHS: "AMD64"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - python --version
    - python -m pip install -U cibuildwheel
  script:
    - python -m cibuildwheel --output-dir wheelhouse
  artifacts:
    paths:
      - wheelhouse/*.whl
    expire_in: 1 week

publish-pypi:
  stage: publish
  image: python:3.12-bookworm
  needs:
    - job: build-linux-wheels
      artifacts: true
    - job: build-windows-wheels
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: release
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - echo "CI_PROJECT_PATH=$CI_PROJECT_PATH"
    - echo "CI_PROJECT_NAMESPACE=$CI_PROJECT_NAMESPACE"
    - echo "CI_PROJECT_NAME=$CI_PROJECT_NAME"
    - echo "CI_CONFIG_PATH=$CI_CONFIG_PATH"
    - echo "CI_ENVIRONMENT_NAME=$CI_ENVIRONMENT_NAME"
    - echo "CI_COMMIT_TAG=$CI_COMMIT_TAG"
    - python -m pip install -U twine
    - python -m twine check wheelhouse/*.whl
    - python -m twine upload wheelhouse/*.whl
