stages:
  - build
  - publish

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_*"
  CIBW_ENVIRONMENT: "FPGA_VERIFICATION_BINARY=1"
  CIBW_TEST_COMMAND: "python -c \"from fpga_verification.formats import QFormat, UIntFormat; print(QFormat(3, 2).float_to_qraw([1.25, -1.0]).tolist()); print(UIntFormat(8).array([257, 258]).tolist())\""

build-linux-wheels:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    CIBW_ARCHS: "x86_64"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache python3 py3-pip
    - python3 -m pip install --break-system-packages -U cibuildwheel
  script:
    - python3 -m cibuildwheel --output-dir wheelhouse
  artifacts:
    paths:
      - wheelhouse/*.whl
    expire_in: 1 week

publish-pypi:
  stage: publish
  image: python:3.12-bookworm
  needs:
    - job: build-linux-wheels
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  environment:
    name: release
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - python -m pip install -U twine
    - python -m twine check wheelhouse/*.whl
    - python -m twine upload wheelhouse/*.whl
