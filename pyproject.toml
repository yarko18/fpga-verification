[project]
name = "fpga-verification"
version = "0.2.2"
description = "Reusable FPGA simulation and hardware-in-the-loop verification tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

authors = [
    { name = "Yaroslav Mariukha"  }
]

[project.optional-dependencies]
sim = [
    "cocotb",
    "cocotb-bus",
    "pyuvm",
]
hil = [
    "tqdm",
]
all = [
    "cocotb",
    "cocotb-bus",
    "pyuvm",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fpga_verification.hil.intel" = ["resources/*.tcl"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *-win32 *-manylinux_i686 *-musllinux_*"
environment = { FPGA_VERIFICATION_BINARY = "1" }
test-command = "python -c \"from fpga_verification.formats import QFormat, UIntFormat; print(QFormat(3, 2).float_to_qraw([1.25, -1.0]).tolist()); print(UIntFormat(8).array([257, 258]).tolist())\""

[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"
