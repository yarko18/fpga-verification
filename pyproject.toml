[project]
name = "fpga-verification"
version = "0.2.0"
description = "Reusable FPGA simulation and hardware-in-the-loop verification tools"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

authors = [
    { name = "Yaroslav Mariukha"  }
]

[project.optional-dependencies]
sim = [
    "cocotb",
    "cocotb-bus",
]
hil = [
    "tqdm",
]
all = [
    "cocotb",
    "cocotb-bus",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fpga_verification.hil.intel" = ["resources/*.tcl"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
