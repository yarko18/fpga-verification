[project]
name = "fpga-verification"
license = "RPL-1.5"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
version = "1.0.2"
description = "Reusable FPGA simulation and hardware-in-the-loop verification tools"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy",
    "cocotb==2.0.1",
    "cocotbext-avalon",
    "pyuvm==4.0.1",
    "tqdm",
]

authors = [
    { name = "Yaroslav Mariukha"  }
]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.urls]
Source = "https://github.com/yarko18/fpga-verification"
Issues = "https://github.com/yarko18/fpga-verification/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fpga_verification.hil.intel" = ["resources/*.tcl"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_*"
environment = { FPGA_VERIFICATION_BINARY = "1" }
test-requires = ["pytest"]
test-command = "python -m pytest -q {project}/tests"

[build-system]
requires = ["setuptools>=61", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"
