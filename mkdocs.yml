site_name: FPGA Verification
site_description: Reusable FPGA simulation and hardware-in-the-loop verification tools
site_url: https://yarko18.github.io/fpga-verification/
repo_url: https://github.com/yarko18/fpga-verification
repo_name: yarko18/fpga-verification

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/default.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/dark.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/wavedrom.min.js
  - javascripts/wavedrom-init.js

extra_css:
  - stylesheets/extra.css

watch:
  - src
