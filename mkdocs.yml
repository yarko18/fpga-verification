site_name: FPGA Verification
site_description: Reusable FPGA simulation and hardware-in-the-loop verification tools
site_url: https://yarko18.github.io/fpga-verification/
repo_url: https://github.com/yarko18/fpga-verification
repo_name: yarko18/fpga-verification

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/default.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/dark.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/wavedrom.min.js
  - javascripts/wavedrom-init.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Build a testbench:
      - Architecture: guide/architecture.md
      - Project style: guide/testbench-style.md
      - Simulation runners: sim/runners.md
      - Modelling DUT behaviour: guide/modeling.md
      - Verification environment: guide/vip-verification.md
      - Stream performance: guide/performance.md
  - Interfaces and data:
      - Avalon-ST: guide/avalon-st.md
      - Avalon-MM and DMA: guide/control-and-memory.md
      - Intel Avalon-ST Video: guide/intel-video.md
      - Video frames: guide/video-frames.md
      - Numeric formats: guide/numeric-formats.md
  - Hardware-in-the-loop: guide/hil.md
  - Release notes:
      - 1.0.0: releases/1.0.0.md

watch:
  - src
