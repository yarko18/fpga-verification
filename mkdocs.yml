site_name: FPGA Verification
site_description: Reusable FPGA simulation and hardware-in-the-loop verification tools
site_url: https://yarko18.github.io/fpga-verification/
repo_url: https://github.com/yarko18/fpga-verification
repo_name: yarko18/fpga-verification

docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: guide/architecture.md
  - Simulation:
      - Runners: sim/runners.md
      - Avalon-ST: guide/avalon-st.md
      - Intel video: guide/intel-video.md
      - VIP verification: guide/vip-verification.md
      - Performance: guide/performance.md
  - Control and memory: guide/control-and-memory.md
  - Hardware-in-the-loop: guide/hil.md
  - Data representation:
      - Video frames: guide/video-frames.md
      - Numeric formats: guide/numeric-formats.md

watch:
  - src
