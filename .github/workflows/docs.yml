name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DRAWIO_VERSION: "31.3.2"
  DRAWIO_SHA256: "725453f32ef7f2f63f8b50b374857a5c312e2aaabcf221cb0600332741ae1094"

jobs:
  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Draw.io CLI
        run: |
          drawio_package="${RUNNER_TEMP}/drawio-amd64-${DRAWIO_VERSION}.deb"
          curl --fail --location --silent --show-error \
            --output "${drawio_package}" \
            "https://github.com/jgraph/drawio-desktop/releases/download/v${DRAWIO_VERSION}/drawio-amd64-${DRAWIO_VERSION}.deb"
          echo "${DRAWIO_SHA256}  ${drawio_package}" | sha256sum --check -
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            xauth xvfb "${drawio_package}"
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation site
        run: python -m mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish-documentation:
    name: Publish documentation
    if: github.event_name == 'push'
    needs: build-documentation
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
